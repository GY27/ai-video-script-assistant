<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="输入主题，生成可直接拍摄的短视频脚本、分镜与口播稿。" />
    <title>AI 短视频脚本助手</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">AI VIDEO SCRIPTING</p>
        <h1>AI 短视频脚本助手</h1>
        <p>输入一个主题，生成可直接拍摄的完整脚本、分镜与口播稿。</p>
      </header>

      <div class="workspace">
        <section class="panel controls-panel" aria-labelledby="settings-title">
          <div class="panel-title">
            <span class="step">01</span>
            <h2 id="settings-title">创作设置</h2>
          </div>
          <form id="script-form">
            <label for="topic">视频主题 <em>*</em></label>
            <textarea id="topic" name="topic" rows="6" required placeholder="请输入你想拍的视频主题，例如：&#10;&#10;为什么现在买二手小鹏P7很划算？&#10;第一次买冲锋衣最容易踩的3个坑"></textarea>

            <div class="field-grid">
              <div>
                <label for="duration">视频时长</label>
                <select id="duration" name="duration">
                  <option value="30秒">30秒</option>
                  <option value="60秒" selected>60秒</option>
                  <option value="90秒">90秒</option>
                  <option value="120秒">120秒</option>
                </select>
              </div>
              <div>
                <label for="contentType">内容类型</label>
                <select id="contentType" name="contentType">
                  <option value="产品介绍">产品介绍</option>
                  <option value="知识分享" selected>知识分享</option>
                  <option value="观点口播">观点口播</option>
                  <option value="种草推荐">种草推荐</option>
                  <option value="测评对比">测评对比</option>
                  <option value="故事型内容">故事型内容</option>
                </select>
              </div>
            </div>

            <label for="model">AI模型</label>
            <select id="model" name="model">
              <option value="DeepSeek" selected>DeepSeek</option>
              <option value="默认模型" disabled>默认模型（暂不可用）</option>
              <option value="DeepSeek">DeepSeek</option>
              <option value="GLM">GLM（智谱）</option>
              <option value="OpenAI" disabled>OpenAI（暂不可用）</option>
              <option value="Gemini" disabled>Gemini（暂不可用）</option>
              <option value="Claude" disabled>Claude（暂不可用）</option>
              <option value="自定义模型" disabled>自定义模型（暂不可用）</option>
            </select>
            <p class="field-hint">可选择 DeepSeek 或 GLM；对应密钥仅保存在 Cloudflare 服务端。</p>
            <label for="personaTemplate">人设模板</label>
            <select id="personaTemplate" name="personaTemplate">
              <option value="理性测评型">理性测评型｜客观、有依据、不夸张</option><option value="朋友分享型" selected>朋友分享型｜自然、真诚、像聊天</option><option value="专业科普型">专业科普型｜清晰、严谨、通俗易懂</option><option value="经验避坑型">经验避坑型｜直接、有观点、强调实用</option><option value="种草推荐型">种草推荐型｜有感染力、但不硬广</option><option value="自定义人设">自定义人设</option>
            </select>
            <label for="persona">我的人设与边界 <span>（可选）</span></label>
            <textarea id="persona" name="persona" rows="4" placeholder="例如：我是一个真实、懂车但不油腻的汽车博主，面向第一次买车的年轻人。不了解的参数不编造，语气像朋友聊天，不强行销售。"></textarea>

            <label for="requirements">创作要求 <span>（可选）</span></label>
            <p class="guide">填写这条视频特别要做到什么，可以按“开头 + 重点 + 语气 + 平台”来写。</p><textarea id="requirements" name="requirements" rows="5" placeholder="例如：&#10;开头3秒直接抛出问题&#10;重点讲新手最容易忽略的地方&#10;不要太销售，像朋友分享&#10;适合小红书，也方便口播"></textarea>

            <button id="generate-button" type="submit"><span>生成脚本</span><span aria-hidden="true">→</span></button>
            <p id="form-message" class="form-message" role="alert"></p>
          </form>
        </section>

        <section class="panel result-panel" aria-live="polite" aria-labelledby="results-title">
          <div class="result-heading">
            <div class="panel-title"><span class="step">02</span><h2 id="results-title">生成结果</h2></div>
            <span id="result-status" class="status">等待创作</span>
          </div>
          <div id="empty-state" class="empty-state">
            <div class="empty-icon">✦</div>
            <h3>从一个好主题开始</h3>
            <p>填写左侧创作设置后，AI 会为你整理开头、完整分镜和可直接念的口播稿。</p>
          </div>
          <div id="loading-state" class="loading-state" hidden>
            <span class="loader"></span><p>正在梳理创作思路，生成脚本中…</p>
          </div>
          <div id="result-content" hidden>
            <section class="result-section">
              <div class="section-kicker">01</div><h3>黄金开头</h3>
              <div id="hooks" class="hooks"></div>
            </section>
            <section class="result-section storyboard-section">
              <div class="section-kicker">02</div><h3>完整分镜脚本</h3>
              <div id="storyboard" class="storyboard"></div>
            </section>
            <section class="result-section voiceover-section">
              <div class="voiceover-title"><div><div class="section-kicker">03</div><h3>完整口播稿</h3></div><button id="copy-button" class="copy-button" type="button">复制口播稿</button></div>
              <p id="full-voiceover" class="full-voiceover"></p>
            </section>
          </div>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
